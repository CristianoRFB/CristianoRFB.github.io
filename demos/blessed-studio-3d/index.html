<script>
(function(){

    {id:'EX-203',name:'Bia (exemplo)',product:'Polvinho articulado',quantity:1,color:'Rosa',details:'Um presente divertido para criança.',status:'Pronto',created:now-344000000},

  function shop(){
    var cats=['Todos','Divertidos','Presentes','Decoração','Utilidades','Personalizados'];
    return '<section class="hero"><div class="shell hero-in"><div><span class="eyebrow">Pequenas ideias. Grandes possibilidades.</span><h1>Do imaginário <em>ao real.</em></h1><p class="hero-description">Presentes, peças criativas e projetos especiais que saem da imaginação e ganham forma na impressão 3D.</p><div class="hero-actions">'+button('Explore as criações <span aria-hidden="true">↗</span>','data-scroll="colecao"')+button('Tenho uma ideia','data-scroll="pedido"','outline')+'</div><div class="hero-micro"><span>IMPRESSÃO 3D PERSONALIZADA</span><i></i><span>SÃO PAULO · SP</span></div></div><div class="hero-stage"><div class="glow"></div><div class="orbit"></div><div class="orbit two"></div><svg class="hero-art" role="img" aria-label="Ilustração autoral de um polvinho articulado e base de exposição" viewBox="0 0 540 490"><ellipse cx="270" cy="430" rx="192" ry="27" fill="#000" opacity=".24"/><ellipse cx="268" cy="389" rx="210" ry="57" fill="#135a8d"/><path d="M59 389v27c0 34 416 34 416 0v-27" fill="#123b60"/><ellipse cx="268" cy="384" rx="209" ry="57" fill="#4a9fd0"/><ellipse cx="268" cy="375" rx="187" ry="46" fill="#6db8d4"/><g transform="translate(45 34) scale(1.24)"><use href="#art-octo"></use></g><path d="M80 419c127 57 257 53 381 1" fill="none" stroke="#6cbce4" stroke-width="4" opacity=".48"/></svg><div class="stage-stamp"><small>ideia em destaque</small><strong>100% criativa</strong></div></div></div></section>'+

    '<section id="colecao" class="section"><div class="shell"><div class="section-heading"><div><p class="kicker">Explore possibilidades</p><h2>Qual ideia combina com você?</h2></div><p class="section-lede">Uma seleção ilustrativa de categorias para mostrar como sua vitrine digital poderia funcionar.</p></div><div class="filter-list" role="group" aria-label="Filtrar produtos">'+cats.map(function(c){return '<button class="filter'+(filter===c?' active':'')+'" data-filter="'+esc(c)+'" aria-pressed="'+(filter===c)+'">'+esc(c)+'</button>';}).join('')+'</div><div class="catalog">'+products.filter(function(p){return filter==='Todos'||p.category===filter;}).map(card).join('')+'</div></div></section>'+

    '<section id="pedido" class="section quote-section"><div class="shell quote-layout"><div class="quote-copy"><p class="kicker">Sua ideia merece sair do papel</p><h2>Vamos criar algo único?</h2><p>Escolha um produto de exemplo ou nos conte sua ideia. Descubra como o pedido seria organizado antes de qualquer produção.</p><div class="check-line"><span class="tick">✓</span><span>Briefing claro: menos mensagens de ida e volta.</span></div><div class="check-line"><span class="tick">✓</span><span>Pedido resumido para compartilhar ou revisar.</span></div><div class="check-line"><span class="tick">✓</span><span>Acompanhamento de status demonstrativo.</span></div></div><form class="quote-form" id="request-form"><h3 style="font-size:26px;margin-bottom:8px">Comece pelo seu projeto</h3><p style="color:#728491;font-size:13px;margin-bottom:26px">Preencha com dados fictícios para testar.</p><div class="form-grid"><div class="field"><label for="name">Seu nome ou apelido *</label><input id="name" name="name" maxlength="50" required placeholder="Ex.: Cliente demo"></div><div class="field"><label for="item">O que gostaria de criar? *</label><select id="item" name="item" required><option value="">Selecione uma opção</option>'+products.map(function(p){return '<option value="'+esc(p.name)+'"'+(p.id===chosen?' selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select></div><div class="field"><label for="qty">Quantidade *</label><input id="qty" type="number" name="qty" min="1" max="100" value="1" required></div><div class="field"><label for="color">Cor desejada</label><select id="color" name="color"><option>A combinar</option><option>Azul</option><option>Rosa</option><option>Verde</option><option>Preto</option><option>Branco</option><option>Outra cor</option></select></div><div class="field full"><label for="details">Conte os detalhes *</label><textarea id="details" name="details" minlength="10" maxlength="800" required placeholder="Qual a finalidade, tamanho aproximado, referência ou outro detalhe?"></textarea><small>Inclua as informações que ajudariam a preparar um orçamento.</small></div></div><p class="notice">Ambiente de demonstração: não compartilhe telefone, endereço ou informações sensíveis. Nada será enviado à Blessed Studio 3D. A solicitação fica somente no armazenamento deste navegador.</p><div class="form-actions"><button type="submit" class="button primary">Criar pedido de exemplo <span aria-hidden="true">↗</span></button></div></form></div></section>';
  }
  function statusBadge(s){return '<span class="status '+statusClass(s)+'">'+esc(s)+'</span>';}
  function filteredOrders(){return orders.filter(function(o){return(orderFilter==='Todos'||o.status===orderFilter)&&(!search||[o.id,o.name,o.product,o.details].join(' ').toLowerCase().includes(search.toLowerCase()));});}
  function adminRows(){var out=filteredOrders();return out.length?out.slice().reverse().map(function(o){return '<article class="order"><div class="order-line"><div><div class="order-name">'+esc(o.name)+'</div><div class="order-meta">'+esc(o.id)+' · '+esc(formatDate(o.created))+' · '+o.quantity+' unidade(s)</div></div>'+statusBadge(o.status)+'</div><p class="order-desc"><strong>'+esc(o.product)+'</strong> · '+esc(o.color)+' — '+esc(o.details)+'</p><div class="order-bottom"><span class="order-meta">Pedido de demonstração</span><label class="order-meta">Alterar etapa <select aria-label="Alterar etapa do pedido '+esc(o.id)+'" class="status-select" data-status="'+esc(o.id)+'">'+stages.map(function(s){return '<option'+(s===o.status?' selected':'')+'>'+esc(s)+'</option>';}).join('')+'</select></label></div></article>';}).join(''):'<div class="empty"><strong>Nenhum pedido encontrado</strong>Tente outro termo ou filtro.</div>';}
  function admin(){var received=orders.filter(function(o){return o.status==='Recebido'||o.status==='Em orçamento';}).length;var making=orders.filter(function(o){return o.status==='Em impressão'||o.status==='Em acabamento';}).length;var done=orders.filter(function(o){return o.status==='Pronto';}).length;
    return '<section class="work-bg"><div class="shell"><div class="crumb"><button data-go="shop">Vitrine</button> / Gestão</div><div class="page-head"><div><p class="kicker">Área de gestão · simulação</p><h1>Produção em foco.</h1><p>Organize pedidos e acompanhe etapas de fabricação em um só lugar.</p></div><div class="page-actions">'+button('Ver vitrine','data-go="shop"','subtle')+button('Restaurar exemplo','data-reset','outline')+'</div></div><div class="metrics"><div class="metric"><i></i><strong>'+orders.length+'</strong><small>Pedidos de exemplo</small></div><div class="metric"><i></i><strong>'+received+'</strong><small>Em análise / orçamento</small></div><div class="metric"><i></i><strong>'+making+'</strong><small>Em produção / acabamento</small></div><div class="metric"><i></i><strong>'+done+'</strong><small>Prontos</small></div></div><div class="management-grid"><div class="pane"><h2>Fila de encomendas</h2><p class="pane-sub">As alterações são locais e não afetam nenhum cliente real.</p><div class="toolbar"><input id="admin-search" aria-label="Buscar pedidos" placeholder="Buscar cliente, peça ou código…" value="'+esc(search)+'"><select id="admin-filter" aria-label="Filtrar pedidos"><option>Todos</option>'+stages.map(function(s){return '<option'+(orderFilter===s?' selected':'')+'>'+s+'</option>';}).join('')+'</select></div><div id="orders-list">'+adminRows()+'</div></div><aside><div class="aside-banner"><div class="small-title">Demonstração interativa</div><h3>Do pedido à peça pronta.</h3><p>Crie uma solicitação na vitrine, volte para este painel e altere o status. Depois, confira o acompanhamento pelo código.</p>'+button('Criar pedido na vitrine <span aria-hidden="true">↗</span>','data-go="shop"','primary')+'</div><div class="aside-caption"><p><strong>Sem login nesta demo</strong><br>Os dados são fictícios. Não há banco de dados, pagamento, envio ao WhatsApp ou gestão real.</p>'+button('Exportar CSV de exemplo','data-export','subtle')+'</div></aside></div></div></section>';
  }
  function timeline(s){var stageIndex=stages.indexOf(s);return '<div class="timeline">'+stages.map(function(name,i){return '<div class="timeline-row'+(i<=stageIndex?' done':'')+'"><span class="timeline-dot">'+(i<=stageIndex?'✓':'·')+'</span><span>'+esc(name)+'</span></div>';}).join('')+'</div>';}

    if(b.hasAttribute('data-filter')){filter=b.dataset.filter;render();var el=document.getElementById('colecao');if(el)el.scrollIntoView({behavior:'instant'});}
    if(b.hasAttribute('data-reset')){if(confirm('Restaurar os pedidos fictícios originais deste navegador?')){orders=seed();save();search='';orderFilter='Todos';render();toast('Cenário de exemplo restaurado.');}}
    if(b.hasAttribute('data-copy')){var o=orders.find(function(o){return o.id===b.dataset.copy;});if(o){var content=summary(o);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(content).then(function(){toast('Resumo copiado para a área de transferência.');}).catch(function(){window.prompt('Copie o texto abaixo:',content);});}else{window.prompt('Copie o texto abaixo:',content);}}}
    if(b.hasAttribute('data-demo-code')){setRoute('acompanhar/'+b.dataset.demoCode);if(location.hash==='#/acompanhar/'+b.dataset.demoCode)render();}
    if(b.hasAttribute('data-export')){var csv=[['Código','Cliente','Produto','Quantidade','Cor','Detalhes','Etapa'],...orders.map(function(o){return [o.id,o.name,o.product,o.quantity,o.color,o.details,o.status];})].map(function(a){return a.map(function(v){var cell=String(v);if(/^[=+\-@]/.test(cell))cell="'"+cell;return '"'+cell.replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});var u=URL.createObjectURL(blob);var a=document.createElement('a');a.href=u;a.download='blessed-studio-3d-demo.csv';a.click();setTimeout(function(){URL.revokeObjectURL(u);},500);toast('CSV fictício exportado.');}
  });
  document.addEventListener('change',function(e){var t=e.target;if(t.matches('[data-status]')){var o=orders.find(function(o){return o.id===t.dataset.status;});if(o&&stages.includes(t.value)){o.status=t.value;save();render();toast('Etapa atualizada apenas nesta demonstração.');}}if(t.matches('#admin-filter')){orderFilter=t.value;document.getElementById('orders-list').innerHTML=adminRows();}});
  document.addEventListener('input',function(e){if(e.target.matches('#admin-search')){search=e.target.value;document.getElementById('orders-list').innerHTML=adminRows();}});
  document.addEventListener('submit',function(e){if(e.target.id==='request-form'){e.preventDefault();var f=new FormData(e.target);var name=String(f.get('name')||'').trim(),product=String(f.get('item')||'').trim(),details=String(f.get('details')||'').trim(),qty=Number(f.get('qty'));if(name.length<2||!products.some(function(p){return p.name===product;})||details.length<10||!Number.isInteger(qty)||qty<1||qty>100){toast('Confira nome, item, quantidade e detalhes antes de continuar.');return;}var o={id:'DEMO-'+String(Date.now()).slice(-7),name:name,product:product,quantity:qty,color:String(f.get('color')||'A combinar'),details:details,status:'Recebido',created:Date.now()};orders.push(o);save();chosen='';lookupId=o.id;setRoute('acompanhar/'+o.id);toast('Pedido de exemplo criado. Nenhuma mensagem foi enviada.');}
  else if(e.target.id==='track-form'){e.preventDefault();var id=String(document.getElementById('track-id').value).trim().slice(0,40);lookupId=id;setRoute('acompanhar/'+encodeURIComponent(id));if(location.hash==='#/acompanhar/'+encodeURIComponent(id))render();}});
  render();
})();
</script>
</body>
